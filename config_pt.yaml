logging_steps: 50
# log_level_replica: info

inf_free: true
model_name_or_path: Luyu/co-condenser-marco
tokenizer_name: Luyu/co-condenser-marco
idf_path: idf.json
use_l0: false

max_seq_length: 256
train_file_dir: [data/pt-kd-ids, data/pt-marco-half]
data_type: kd-ids
loss_types: [kldiv]
sample_num_one_query: 3
use_in_batch_negatives: true
flops_d_lambda: 0.01
flops_d_T: 10000
ranking_loss_weight: 1
kd_ensemble_teacher_kwargs:
  types: ["dense", "sparse", "remote", "remote"]
  model_ids: ["Alibaba-NLP/gte-large-en-v1.5","opensearch-project/opensearch-neural-sparse-encoding-v1","3", "4"]
  teacher_tokenizer_ids: ["Alibaba-NLP/gte-large-en-v1.5","opensearch-project/opensearch-neural-sparse-encoding-v1","3", "4"]
  score_scale: 30
first_rank_thresh: 10

output_dir: output/pt/with-34-marco-co-condenser
per_device_eval_batch_size: 50
per_device_train_batch_size: 15

log_level: info
max_steps: 300000
fp16: true
learning_rate: 0.00002
weight_decay: 0.01
lr_scheduler_type: linear
warmup_steps: 6000
save_strategy: steps
save_steps: 200000
dataloader_drop_last: true