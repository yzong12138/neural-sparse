logging_steps: 50
# log_level_replica: info
split_batch: 5

inf_free: false
model_name_or_path: google-bert/bert-base-multilingual-uncased
tokenizer_name: google-bert/bert-base-multilingual-uncased

max_seq_length: 256
train_file: data/msmarco_ft
data_type: kd
loss_types: [marginmse]
sample_num_one_query: 2
use_in_batch_negatives: false
flops_d_lambda: 0.6
flops_d_T: 50000
flops_q_lambda: 0.75
flops_q_T: 50000
ranking_loss_weight: 1

output_dir: output/baselines/bi-multi
per_device_eval_batch_size: 50
per_device_train_batch_size: 20

log_level: info
max_steps: 150000
fp16: true
learning_rate: 0.00002
weight_decay: 0.01
lr_scheduler_type: linear
warmup_steps: 6000
save_strategy: steps
save_steps: 150000
dataloader_drop_last: true
max_grad_norm: null